services:
  - type: web
    name: upi-guard-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: UPI_GUARD_REQUIRE_AUTH
        value: "1"
      - key: UPI_GUARD_API_KEY
        sync: false
      - key: UPI_GUARD_SIGNING_KEY
        generateValue: true
      - key: UPI_GUARD_DB_PATH
        value: /tmp/upi-guard-events.db
      - key: UPI_GUARD_EPHEMERAL
        value: "1"
